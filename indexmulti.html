<html>
  <head>
    <link rel="stylesheet" href="aitutor.css">

  </head>
  <body>

<div class="container">
  <h1>@TheAcademy AI-Intake (Multi)</h1>
  
  <div class="form-row">
    <button type="button" onclick="mt_start_systeem()">Start Systeem</button>
    <label for="kandidaatnr">Studentnr:</label>
    <input id="kandidaatnr">
    <label for="opleidingsnr">Opleidingsnr:</label>
    <select id="opleidingsnr">
      <option value="1">pl-300</option>
      <option value="2" selected>az-900</option>
      <option value="3">ai-102</option>
      <option value="4">ai-900</option>
    </select>
    <button onclick="ga_naar_vragen_editor()">vrageneditor(docent)</button>
  </div>
  
  <h2>Motivatie Systeem: (denkproces)</h2>
  <h3 id="motivatie">...</h3>
  
  <h2>Vraag:</h2>
  <h3 id="vraag">...</h3>
  <h2 id="titeljouwantwoord">Jouw Antwoord:</h2>
  <div id="antwoord"></div><br>
  

  <hr>
  <h2>KennisMatrix:</h2>
  <div id="kennismatrix"></div>
  <input id="categorie_volgende_vraag" disabled><br>
</div>
<script src="aitutor.js"></script>
<script src="mt_aitutor.js"></script>
<script>
  document.getElementById("kandidaatnr").value = Math.floor(Math.random() * 5000) + 1;
  function ga_naar_vragen_editor(){
    const opleidingsnr = document.getElementById("opleidingsnr").value;
    window.location = `vrageneditor/index.html?opleidingsnummer=${opleidingsnr}`
  }
</script>
<style>
</style>
  </body>
</html>
