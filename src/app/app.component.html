<main class="game-wrapper">
  <section class="game-card">
    <header>
      <h1>Vier op een rij</h1>
      <p>{{ statusMessage() }}</p>
    </header>

    <div class="board" role="grid" aria-label="Speelbord">
      <div
        class="column"
        role="button"
        tabindex="0"
        *ngFor="let column of columnIndices"
        (click)="dropDisc(column)"
        (keydown.enter)="dropDisc(column)"
        (keydown.space)="dropDisc(column)"
        (mouseenter)="setHoveredColumn(column)"
        (mouseleave)="setHoveredColumn(null)"
        [class.disabled]="isColumnDisabled(column)"
        [attr.aria-label]="'Kolom ' + (column + 1)"
        [attr.aria-disabled]="isColumnDisabled(column)"
      >
        <div
          class="cell"
          *ngFor="let row of rowIndices"
          [class.red]="getCellState(row, column) === 1"
          [class.yellow]="getCellState(row, column) === 2"
          [class.last-move]="isLastMove(row, column)"
        >
          <span
            class="preview"
            *ngIf="canPreview(row, column)"
            [class.red]="currentPlayer() === 1"
            [class.yellow]="currentPlayer() === 2"
          ></span>
        </div>
      </div>
    </div>

    <footer>
      <button type="button" (click)="resetGame()">Opnieuw starten</button>
    </footer>
  </section>
</main>
